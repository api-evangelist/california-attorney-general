summary: 'The DOJ operates the OpenJustice JSON:API without any published lifecycle governance: no version scheme,
  no deprecation policy, no Sunset signalling, no SLA and no status page. This is the predictable consequence of
  the surface being an unadvertised by-product of the CMS behind the OpenJustice app rather than a declared product.
  Recorded as a measured absence with the probes that establish it.'
