apis:
- aid: california-attorney-general:openjustice-open-data-portal-jsonapi
  name: OpenJustice Open Data Portal JSON:API
  description: The live JSON:API 1.0 surface behind the Attorney General's OpenJustice Open Data Portal, served
    anonymously by Drupal 9 at https://data-openjustice.doj.ca.gov/jsonapi. It carries the 26 published criminal-justice
    datasets with their 148 CSV/XLSX/ZIP/PDF distributions (direct downloads under /sites/default/files/), the six
    Exploration stats pages, the CJSC statistical publications and their per-year report PDFs, the OpenJustice data
    stories and the site taxonomies. Reads are anonymous with JSON:API filtering, sorting, sparse fieldsets, relationship
    includes and 50-per-page offset pagination; anonymous create is granted only on the three feedback routes the
    site footer uses (signup, suggestion, bug) and every other write returns 401. Not published or documented by
    the DOJ — found through the axios baseURL in the OpenJustice app bundle and described from live probes on 2026-09-17.
