summary: 'The OpenJustice JSON:API requires no authentication for reads. Every collection and individual read was
  performed anonymously with no header, key, cookie or token and returned HTTP 200 application/vnd.api+json. There
  is no sign-up, no key issuance, no OAuth authorization server and no developer account, because there is no developer
  programme. Writes are a different story from most government Drupal JSON:API sites: the module is NOT configured
  read-only. Anonymous create is granted on the three feedback content types the site footer posts to (node--signup,
  node--suggestion, node--bug); every other write route answers 401 ''No authentication credentials provided.''
  with no documented way for a member of the public to obtain credentials — those routes exist for DOJ content editors.'
