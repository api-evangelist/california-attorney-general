model:
  anonymous_read: true
  credentialed_read: not-offered
  write: anonymous on node--signup / node--suggestion / node--bug only; credentialed (undocumented, staff) elsewhere
  note: Empty-body anonymous POST returns 400 "Empty request body." on the three feedback routes (authorisation
    passed, validation failed) and 401 on every other route probed. No populated write was sent.
authorization_visible_in_responses:
  mechanism: Drupal entity access, applied silently per resource type
  signal: meta.omitted
  detail: 32 of the 70 advertised resource types return HTTP 200 with an empty data array and a meta.omitted block.
    These are configuration entities (views, field definitions, roles, webforms, workflows) plus the three feedback
    types and node--dataset when paged with page[limit]=1 (its lowest-id node is unpublished). A caller sees a 200
    and an empty collection, not a 401 or 403.
