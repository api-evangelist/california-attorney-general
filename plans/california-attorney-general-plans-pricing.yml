description: The California Department of Justice publishes no plans, no pricing, no tiers and no metered API product.
  Everything it serves over HTTP — the JSON:API at data-openjustice.doj.ca.gov/jsonapi, every dataset download under
  /sites/default/files/, and the oag.ca.gov RSS feed — is free, anonymous and uncapped by policy. Data not on the
  portal is obtained through the Research Services data request process (datarequests@doj.ca.gov), which is a human
  workflow, not a plan. An honest zero rather than an absence of measurement.
