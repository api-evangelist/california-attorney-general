description: 'The DOJ publishes no rate limits and returns no rate-limit headers. Over roughly 570 anonymous requests
  on 2026-09-17 — a full 70-resource-type sweep plus complete pagination walks of ten collections (488 files, 226
  charts, 127 data stories) — not one response carried X-RateLimit-*, RateLimit-* or Retry-After, and no request
  was throttled or rejected. An honest zero: nothing is documented, and nothing was observed.'
