assessment:
  strengths:
  - Every dataset carries at least one machine-readable distribution (CSV/XLSX/ZIP) plus a context PDF; the largest
    series run 1980-2025 (Arrests) and 1985-2025 (Crimes and Clearances).
  - Distribution files carry filemime and filesize, so a consumer can size a download before fetching.
  - Revision logs on the dataset nodes ("Add 2025 files") date each refresh; all 26 were refreshed June-July 2026.
  gaps:
  - No DCAT/data.json catalog, no licence statement on the datasets, no schema or data dictionary beyond the context
    PDFs.
  - File names carry the year range and revision suffixes (_0) rather than stable identifiers; a consumer must re-read
    the API to find the current file after each annual refresh.
  - The data itself is not queryable — the API serves metadata and file pointers, not rows.
  - 'The dataset collection is not discoverable from the SPA host: every machine-facing path on openjustice.doj.ca.gov
    returns the HTML shell.'
