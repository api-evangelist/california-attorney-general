  OpenJustice Open Data Portal, read on 2026-09-17 from the live JSON:API with their 148 file distributions side-loaded.
  The DOJ publishes no data.json / DCAT catalog and no /.well-known/api-catalog; the dataset list is reachable to
  a human only through the JS-rendered https://openjustice.doj.ca.gov/data page, and to a machine only through the
  JSON:API on the data host. Distribution URLs are direct downloads (verified: text/csv, 1,749,288 bytes). Each
  dataset entry also ships a Context PDF describing the collection, which is the only data documentation the DOJ
  publishes.'
