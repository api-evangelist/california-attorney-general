openapi: 3.2.0
info:
  title: 'California DOJ OpenJustice Open Data Portal JSON: Content…'
  version: '1.0'
  summary: Anonymous JSON:API 1.0 over the California Department of Justice OpenJustice open-data portal — the Attorney General's criminal-justice datasets (Arrests, Crimes & Clearances, Homicide, Hate Crime, Use of Force, RIPA stop data, deaths in custody and 19 more), their CSV/XLSX distributions, CJSC publications and data stories.
  description: The California Attorney General heads the California Department of Justice, whose Criminal Justice Statistics Center runs the OpenJustice initiative (https://openjustice.doj.ca.gov).
  contact:
    name: California Department of Justice — Criminal Justice Statistics Center
    email: datarequests@doj.ca.gov
    url: https://oag.ca.gov/research-services/request-process
  termsOfService: https://oag.ca.gov/conditions
  license:
    name: California DOJ conditions of use (public government data; no licence text is attached to the files)
    url: https://oag.ca.gov/conditions
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://data-openjustice.doj.ca.gov/jsonapi
  x-derived-on: '2026-09-17'
  x-publisher-provided: false
servers:
- url: https://data-openjustice.doj.ca.gov/jsonapi
  description: Production JSON:API entry point (Drupal 9, behind an F5 load balancer that sets an `oag.ca.gov` persistence cookie). Public, anonymous reads.
security: []
tags:
- name: Content
  description: Datasets, publications, stats pages, data stories and site pages (node entities).
paths:
  /node/dataset:
    get:
      operationId: listNodeDataset
      summary: List node--dataset resources
      tags:
      - Content
      description: 'OpenJustice Open Data Portal datasets — the 26 published criminal-justice data products (Arrests, Crimes and Clearances, Homicide, Hate Crime, Use of Force, RIPA Stop Data, Death in Custody, Domestic Violence calls, Gun Violence Restraining Orders, Electronic Search Warrant notifications and more). Each dataset relates to its CSV/XLSX/ZIP/PDF distributions through `field_source` (file--file) and to a data-type taxonomy term through `field_data_type`. This is the collection a data consumer wants.


        Probed anonymously 2026-09-17: HTTP 200, `application/vnd.api+json`, 26 resource object(s) returned from https://data-openjustice.doj.ca.gov/jsonapi/node/dataset. Note: `?page[limit]=1` returns an empty page with meta.omitted because the lowest-id dataset node is unpublished; request the collection without page[limit]=1, or with page[limit]=50, to receive all 26 published datasets.'
      parameters:
      - $ref: '#/components/parameters/pageLimit'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: JSON:API collection document.
          content:
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CollectionDocument'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/NodeDataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-probe:
        url: https://data-openjustice.doj.ca.gov/jsonapi/node/dataset
        http_status: 200
        content_type: application/vnd.api+json
        fetched: '2026-09-17'
        resources_returned: 26
  /node/dataset/{id}:
    get:
      operationId: getNodeDataset
      summary: Get one node--dataset resource by UUID
      tags:
      - Content
      description: Returns a single `node--dataset` resource object. Individual reads were verified on 2026-09-17 against `node--stats` (self link of the Adult Probation Caseload & Actions page). An unknown UUID returns HTTP 404 with a JSON:API error document.
      parameters:
      - $ref: '#/components/parameters/resourceId'
