          type: object
          properties:
            pointer:
              type: string
            parameter:
              type: string
  parameters:
    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resource UUID (the JSON:API `id`, not `drupal_internal__nid`).
    pageLimit:
      name: page[limit]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
      description: 'Page size. Drupal caps the page at 50 and silently clamps larger values — verified 2026-09-17:
        `?page[limit]=100` on node/data_story returned 50 items and a `links.next` offset of 50.'
    pageOffset:
      name: page[offset]
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based offset. Follow `links.next` rather than computing offsets.
    sort:
      name: sort
      in: query
      schema:
        type: string
      description: Comma-separated attribute names; prefix with `-` for descending (JSON:API 1.0). Verified with
        `sort=title`.
      example: title
    filter:
      name: filter
      in: query
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: true
      description: 'Drupal JSON:API filter family: `filter[<field>]=value` for equality, or `filter[<field>][operator]=CONTAINS&filter[<field>][value]=...`
        for other operators (=, <>, >, >=, <, <=, STARTS_WITH, CONTAINS, ENDS_WITH, IN, NOT IN, IS NULL, IS NOT
        NULL, BETWEEN). Verified 2026-09-17: `filter[title][operator]=CONTAINS&filter[title][value]=Arrest` on node/dataset
        returned 3 datasets; an unknown field returns HTTP 400 "Invalid nested filtering."'
      example: filter[title][operator]=CONTAINS&filter[title][value]=Arrest
    include:
      name: include
      in: query
      schema:
        type: string
      description: 'Comma-separated relationship paths to side-load into `included` (JSON:API compound documents).
        Verified 2026-09-17: `include=field_source,field_data_type` on node/dataset side-loaded 148 file--file distributions
        across the 26 datasets.'
      example: field_source,field_data_type
    fields:
      name: fields
      in: query
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
      description: 'Sparse fieldsets keyed by resource type: `fields[file--file]=uri,filesize,filemime,filename`.
        Verified.'
      example: fields[file--file]=uri,filesize,filemime,filename
  responses:
    BadRequest:
      description: Malformed query (unknown filter field, bad sort, empty request body). JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            jsonapi:
              version: '1.0'
              meta:
                links:
                  self:
                    href: http://jsonapi.org/format/1.0/
            errors:
            - title: Bad Request
              status: '400'
              detail: Invalid nested filtering. The field `nonexistent_field`, given in the path `nonexistent_field`,
                does not exist.
              links:
                via:
                  href: https://data-openjustice.doj.ca.gov/jsonapi/node/dataset?filter%5Bnonexistent_field%5D=x
                info:
                  href: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4.1
    NotFound:
      description: No resource with that UUID. JSON:API error document.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            jsonapi:
              version: '1.0'
              meta:
                links:
                  self:
                    href: http://jsonapi.org/format/1.0/
            errors:
            - title: Not Found
              status: '404'
              detail: 'The "entity" parameter was not converted for the path "/jsonapi/node/dataset/{entity}" (route
                name: "jsonapi.node--dataset.individual")'
              links:
                via:
                  href: https://data-openjustice.doj.ca.gov/jsonapi/node/dataset/00000000-0000-0000-0000-000000000000
                info:
                  href: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4.5
    Unauthorized:
      description: Write attempted without credentials on a route that requires them.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            jsonapi:
              version: '1.0'
              meta:
                links:
                  self:
                    href: http://jsonapi.org/format/1.0/
            errors:
            - title: Unauthorized
              status: '401'
              detail: No authentication credentials provided.
              links:
                via:
                  href: https://data-openjustice.doj.ca.gov/jsonapi/node/dataset
                info:
                  href: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4.2
    ServiceUnavailable:
      description: Not observed during the probe; listed because the site runs behind an F5 load balancer (persistence
        cookie `oag.ca.gov`) that answers on behalf of an unavailable origin.
