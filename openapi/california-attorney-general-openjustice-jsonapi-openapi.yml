          examples:
          - Bad Request
          - Not Found
          - Unauthorized
          - Method Not Allowed
        status:
          type: string
          description: HTTP status as a STRING, per JSON:API 1.0.
          examples:
          - '400'
          - '404'
          - '401'
        detail:
          type: string
        links:
          type: object
          properties:
            via:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            info:
              type: object
              properties:
                href:
                  type: string
                  format: uri
